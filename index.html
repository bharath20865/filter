<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12100c" />
    <title>Golden Aura</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">LIVE BEAUTY CAMERA</p>
          <h1>Golden Aura</h1>
        </div>
        <span class="live-status" id="status" aria-live="polite">Ready</span>
      </header>

      <section class="camera-card" aria-label="Live camera preview">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="captureCanvas" aria-hidden="true"></canvas>
        <div class="empty-state" id="emptyState">
          <span class="sun">✦</span>
          <p>Your front-camera preview will appear here.</p>
        </div>
        <div class="aura" aria-hidden="true"></div>
        <div class="face-effects" id="faceEffects" aria-hidden="true">
          <div class="butterfly butterfly-left"><span>◜</span><span>◝</span></div>
          <div class="butterfly butterfly-right"><span>◜</span><span>◝</span></div>
          <i class="spark spark-1"></i><i class="spark spark-2"></i><i class="spark spark-3"></i>
          <i class="spark spark-4"></i><i class="spark spark-5"></i><i class="spark spark-6"></i>
        </div>
        <div class="camera-caption">Natural glow • eyes unchanged</div>
      </section>

      <section class="control-panel" aria-label="Camera controls">
        <div class="glow-control">
          <label for="glow">Glow <output id="glowValue">42%</output></label>
          <input id="glow" type="range" min="0" max="100" value="42" />
        </div>
        <div class="actions">
          <button class="secondary" id="stopButton" type="button" disabled>Stop</button>
          <button class="shutter" id="captureButton" type="button" disabled aria-label="Capture photo"><span></span></button>
          <button class="primary" id="startButton" type="button">Start camera</button>
        </div>
      </section>

      <p class="privacy-note">Camera video stays on this device. A photo is only created when you tap the shutter.</p>
      <a id="downloadLink" hidden download="golden-aura.jpg">Download photo</a>
    </main>
    <script src="app.js"></script>
  </body>
</html>
